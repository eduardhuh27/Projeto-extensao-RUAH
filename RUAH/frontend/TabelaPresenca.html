<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada - Sistema RUAH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <div class="user-profile">
                <svg class="user-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 6C13.93 6 15.5 7.57 15.5 9.5C15.5 11.43 13.93 13 12 13C10.07 13 8.5 11.43 8.5 9.5C8.5 7.57 10.07 6 12 6ZM12 20C9.97 20 7.57 19.18 5.86 17.12C7.55 15.8 9.68 15 12 15C14.32 15 16.45 15.8 18.14 17.12C16.43 19.18 14.03 20 12 20Z" />
                </svg>
                <span>Sistema RUAH</span>
            </div>
        </div>
        <div class="nav-links">
            <div class="dropdown">
                <span class="text-button dropbtn">MENU ▼</span>
                <div class="dropdown-content">
                    <a href="CadastroEdicaojovens.html">Cadastro de Jovens</a>
                    <a href="Configuracoes.html">Configurações</a>
                    <a href="TabelaPresenca.html">Chamada</a>
                    <a href="RelatorioPresenca.html">Relatório de Presença</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">

        <div class="card card-large">
            <h1>Tabela de Presença</h1>

            <div class="select-group">
                <label>Evento</label>
                <div class="select-wrapper">
                    <select id="evento_id" class="form-control">
                        <option value="">Selecione um evento</option>
                    </select>
                </div>
            </div>

            <div class="table-area">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Setor</th>
                            <th>Presente</th>
                            <th>Ausente</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-chamada">
                        <tr><td colspan="4">Carregando jovens...</td></tr>
                    </tbody>
                </table>
            </div>

            <div style="width:100%; text-align:center;">
                <button id="btn-salvar" class="primary-button btn-form">Salvar Chamada</button>
            </div>
            <p class="form-msg" id="msg"></p>
        </div>
    </main>

    <script>
        const API = 'http://localhost:3000/api';
        let jovens = [];

        async function carregarEventos() {
            const select = document.getElementById('evento_id');
            try {
                const res = await fetch(`${API}/eventos`);
                const eventos = await res.json();
                eventos.forEach(ev => {
                    const opt = document.createElement('option');
                    opt.value = ev.id;
                    opt.textContent = ev.titulo;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Erro ao carregar eventos', e);
            }
        }

        async function carregarJovens() {
            const corpo = document.getElementById('corpo-chamada');
            try {
                const res = await fetch(`${API}/membros`);
                jovens = await res.json();
                corpo.innerHTML = '';
                if (jovens.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="4">Nenhum jovem cadastrado.</td></tr>';
                    return;
                }
                jovens.forEach(j => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${j.nome}</td>
                        <td>${j.setor_nome || '-'}</td>
                        <td class="col-checkbox"><input type="checkbox" name="presenca-${j.id}" data-id="${j.id}" class="chk-presente" checked></td>
                        <td class="col-checkbox"><input type="checkbox" name="presenca-${j.id}" data-id="${j.id}" class="chk-ausente"></td>
                    `;
                    corpo.appendChild(tr);
                });

                // Presente e Ausente são mutuamente exclusivos
                document.querySelectorAll('.chk-presente').forEach(chk => {
                    chk.addEventListener('change', () => {
                        if (chk.checked) {
                            document.querySelector(`.chk-ausente[data-id="${chk.dataset.id}"]`).checked = false;
                        }
                    });
                });
                document.querySelectorAll('.chk-ausente').forEach(chk => {
                    chk.addEventListener('change', () => {
                        if (chk.checked) {
                            document.querySelector(`.chk-presente[data-id="${chk.dataset.id}"]`).checked = false;
                        }
                    });
                });
            } catch (e) {
                corpo.innerHTML = '<tr><td colspan="4">Não foi possível carregar (backend offline?).</td></tr>';
            }
        }

        document.getElementById('btn-salvar').addEventListener('click', async () => {
            const msg = document.getElementById('msg');
            msg.textContent = '';
            msg.className = 'form-msg';

            const eventoId = document.getElementById('evento_id').value;
            if (!eventoId) {
                msg.textContent = 'Selecione um evento antes de salvar.';
                msg.classList.add('erro');
                return;
            }

            const listaPresenca = jovens.map(j => {
                const ausente = document.querySelector(`.chk-ausente[data-id="${j.id}"]`).checked;
                return { membro_id: j.id, status: ausente ? 'Ausente' : 'Presente' };
            });

            try {
                const res = await fetch(`${API}/chamada`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento_id: eventoId, listaPresenca })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = data.message;
                    msg.classList.add('ok');
                } else {
                    msg.textContent = data.error || 'Erro ao salvar chamada.';
                    msg.classList.add('erro');
                }
            } catch (err) {
                msg.textContent = 'Não foi possível conectar ao servidor.';
                msg.classList.add('erro');
            }
        });

        carregarEventos();
        carregarJovens();
    </script>

</body>
</html>
