<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Presença - Sistema RUAH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <div class="user-profile">
                <svg class="user-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 6C13.93 6 15.5 7.57 15.5 9.5C15.5 11.43 13.93 13 12 13C10.07 13 8.5 11.43 8.5 9.5C8.5 7.57 10.07 6 12 6ZM12 20C9.97 20 7.57 19.18 5.86 17.12C7.55 15.8 9.68 15 12 15C14.32 15 16.45 15.8 18.14 17.12C16.43 19.18 14.03 20 12 20Z" />
                </svg>
                <span>Sistema RUAH</span>
            </div>
        </div>
        <div class="nav-links">
            <div class="dropdown">
                <span class="text-button dropbtn">MENU ▼</span>
                <div class="dropdown-content">
                    <a href="CadastroEdicaojovens.html">Cadastro de Jovens</a>
                    <a href="Configuracoes.html">Configurações</a>
                    <a href="TabelaPresenca.html">Chamada</a>
                    <a href="RelatorioPresenca.html">Relatório de Presença</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">

        <div class="card card-large">
            <h1>Relatório de Presença</h1>

            <table class="simple-table">
                <thead>
                    <tr>
                        <th>Jovem</th>
                        <th class="col-narrow">Frequência</th>
                    </tr>
                </thead>
                <tbody id="corpo-relatorio">
                    <tr><td colspan="2">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
        const API = 'http://localhost:3000/api';

        async function carregarRelatorio() {
            const corpo = document.getElementById('corpo-relatorio');
            try {
                const res = await fetch(`${API}/relatorios/frequencia`);
                const dados = await res.json();
                corpo.innerHTML = '';
                if (dados.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="2">Nenhum dado disponível.</td></tr>';
                    return;
                }
                dados.forEach(j => {
                    const tr = document.createElement('tr');
                    const badgeClass = j.alerta ? 'badge-alerta' : 'badge-ok';
                    tr.innerHTML = `<td>${j.nome}</td><td class="col-narrow"><span class="badge ${badgeClass}">${j.frequencia}</span></td>`;
                    corpo.appendChild(tr);
                });
            } catch (e) {
                corpo.innerHTML = '<tr><td colspan="2">Não foi possível carregar (backend offline?).</td></tr>';
            }
        }

        carregarRelatorio();
    </script>

</body>
</html>
