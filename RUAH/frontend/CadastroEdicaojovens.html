<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Jovem - Sistema RUAH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <div class="user-profile">
                <svg class="user-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 6C13.93 6 15.5 7.57 15.5 9.5C15.5 11.43 13.93 13 12 13C10.07 13 8.5 11.43 8.5 9.5C8.5 7.57 10.07 6 12 6ZM12 20C9.97 20 7.57 19.18 5.86 17.12C7.55 15.8 9.68 15 12 15C14.32 15 16.45 15.8 18.14 17.12C16.43 19.18 14.03 20 12 20Z" />
                </svg>
                <span>Sistema RUAH</span>
            </div>
        </div>
        <div class="nav-links">
            <div class="dropdown">
                <span class="text-button dropbtn">MENU ▼</span>
                <div class="dropdown-content">
                    <a href="CadastroEdicaojovens.html">Cadastro de Jovens</a>
                    <a href="Configuracoes.html">Configurações</a>
                    <a href="TabelaPresenca.html">Chamada</a>
                    <a href="RelatorioPresenca.html">Relatório de Presença</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">

        <div class="card card-left">
            <h2>Jovens Cadastrados</h2>
            <table class="data-table" id="tabela-jovens">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Setor</th>
                    </tr>
                </thead>
                <tbody id="corpo-jovens">
                    <tr><td colspan="2">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card card-right">
            <h2>Cadastro de Jovem</h2>
            <form id="form-jovem" style="width:100%;">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="telefone">
                </div>
                <div class="form-group">
                    <label>Nascimento</label>
                    <input type="date" id="data_nascimento" required>
                </div>
                <div class="form-group">
                    <label>Setor</label>
                    <div class="select-wrapper">
                        <select id="setor_id" class="form-control">
                            <option value="">Selecione</option>
                        </select>
                    </div>
                </div>
                <div style="width:100%; text-align:center;">
                    <button type="submit" class="primary-button">Cadastrar</button>
                </div>
                <p class="form-msg" id="msg"></p>
            </form>
        </div>

    </main>

    <script>
        const API = 'http://localhost:3000/api';

        async function carregarSetores() {
            const select = document.getElementById('setor_id');
            try {
                const res = await fetch(`${API}/config/setores`);
                const setores = await res.json();
                setores.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.nome;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Erro ao carregar setores', e);
            }
        }

        async function carregarJovens() {
            const corpo = document.getElementById('corpo-jovens');
            try {
                const res = await fetch(`${API}/membros`);
                const jovens = await res.json();
                corpo.innerHTML = '';
                if (jovens.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="2">Nenhum jovem cadastrado.</td></tr>';
                    return;
                }
                jovens.forEach(j => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${j.nome}</td><td>${j.setor_nome || '-'}</td>`;
                    corpo.appendChild(tr);
                });
            } catch (e) {
                corpo.innerHTML = '<tr><td colspan="2">Não foi possível carregar (backend offline?).</td></tr>';
            }
        }

        document.getElementById('form-jovem').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.textContent = '';
            msg.className = 'form-msg';

            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                setor_id: document.getElementById('setor_id').value || null
            };

            try {
                const res = await fetch(`${API}/membros`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = data.message;
                    msg.classList.add('ok');
                    e.target.reset();
                    carregarJovens();
                } else {
                    msg.textContent = data.error || 'Erro ao cadastrar.';
                    msg.classList.add('erro');
                }
            } catch (err) {
                msg.textContent = 'Não foi possível conectar ao servidor.';
                msg.classList.add('erro');
            }
        });

        carregarSetores();
        carregarJovens();
    </script>

</body>
</html>
