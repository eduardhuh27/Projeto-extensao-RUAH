<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Sistema RUAH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <div class="user-profile">
                <svg class="user-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 6C13.93 6 15.5 7.57 15.5 9.5C15.5 11.43 13.93 13 12 13C10.07 13 8.5 11.43 8.5 9.5C8.5 7.57 10.07 6 12 6ZM12 20C9.97 20 7.57 19.18 5.86 17.12C7.55 15.8 9.68 15 12 15C14.32 15 16.45 15.8 18.14 17.12C16.43 19.18 14.03 20 12 20Z" />
                </svg>
                <span>Sistema RUAH</span>
            </div>
        </div>
        <div class="nav-links">
            <div class="dropdown">
                <span class="text-button dropbtn">MENU ▼</span>
                <div class="dropdown-content">
                    <a href="CadastroEdicaojovens.html">Cadastro de Jovens</a>
                    <a href="Configuracoes.html">Configurações</a>
                    <a href="TabelaPresenca.html">Chamada</a>
                    <a href="RelatorioPresenca.html">Relatório de Presença</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">

        <div class="card">
            <h2>Setores / Bairros</h2>

            <div class="search-container">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="busca" placeholder="Buscar setor...">
                <span class="close-icon" id="limpar-busca">&#10006;</span>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade mín.</th>
                        <th>Idade máx.</th>
                    </tr>
                </thead>
                <tbody id="corpo-setores">
                    <tr><td colspan="3">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Novo Setor</h2>

            <form id="form-setor" style="width:100%;">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="descricao" class="form-control">
                </div>

                <div class="form-group">
                    <label>Idade mín.</label>
                    <input type="number" id="idade_min" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Idade máx.</label>
                    <input type="number" id="idade_max" class="form-control" required>
                </div>

                <div style="width:100%; text-align:center;">
                    <button type="submit" class="primary-button btn-form">Salvar Setor</button>
                </div>
                <p class="form-msg" id="msg"></p>
            </form>
        </div>

    </main>

    <script>
        const API = 'http://localhost:3000/api';

        async function carregarSetores(busca = '') {
            const corpo = document.getElementById('corpo-setores');
            try {
                const url = busca ? `${API}/config/setores?search=${encodeURIComponent(busca)}` : `${API}/config/setores`;
                const res = await fetch(url);
                const setores = await res.json();
                corpo.innerHTML = '';
                if (setores.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="3">Nenhum setor encontrado.</td></tr>';
                    return;
                }
                setores.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${s.nome}</td><td class="col-narrow">${s.idade_min}</td><td class="col-narrow">${s.idade_max}</td>`;
                    corpo.appendChild(tr);
                });
            } catch (e) {
                corpo.innerHTML = '<tr><td colspan="3">Não foi possível carregar (backend offline?).</td></tr>';
            }
        }

        document.getElementById('busca').addEventListener('input', (e) => {
            carregarSetores(e.target.value);
        });

        document.getElementById('limpar-busca').addEventListener('click', () => {
            document.getElementById('busca').value = '';
            carregarSetores();
        });

        document.getElementById('form-setor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.textContent = '';
            msg.className = 'form-msg';

            const payload = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                idade_min: Number(document.getElementById('idade_min').value),
                idade_max: Number(document.getElementById('idade_max').value)
            };

            try {
                const res = await fetch(`${API}/config/setores`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = data.message;
                    msg.classList.add('ok');
                    e.target.reset();
                    carregarSetores();
                } else {
                    msg.textContent = data.error || 'Erro ao salvar setor.';
                    msg.classList.add('erro');
                }
            } catch (err) {
                msg.textContent = 'Não foi possível conectar ao servidor.';
                msg.classList.add('erro');
            }
        });

        carregarSetores();
    </script>

</body>
</html>
