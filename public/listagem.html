<script>
    // Quando a página carregar, executa essa função
        window.addEventListener('DOMContentLoaded', () => {
            // 1. Pega os dados que foram salvos no login
            const usuarioSalvo = localStorage.getItem('usuarioLogado');

            // 2. Verifica se existe alguém logado
            if (usuarioSalvo) {
                // Converte o texto salvo de volta para um objeto JavaScript
                const usuario = JSON.parse(usuarioSalvo);

                // 3. Troca o texto do span pelo nome do usuário
                // ATENÇÃO: Confirme se a propriedade se chama 'nome' no seu banco de dados
                document.querySelector('#perfil span').textContent = usuario.nome;
            } else {
                // Se não tiver dados (usuário tentou entrar direto pela URL sem logar)
                // Redireciona ele de volta para o login por segurança
                window.location.href = 'login.html';
            }
        });

        // Lógica do botão de deslogar (mantida)
        document.getElementById('btnSair').addEventListener('click', function() {
            localStorage.clear(); 
            sessionStorage.clear(); 
            window.location.href = 'login.html';
        });

       const apiURL = 'http://localhost:3000/api/jovens';

// 1. Função Principal: Buscar dados e renderizar a lista
async function carregarJovens() {
    try {
        const response = await fetch(apiURL);
        const jovens = await response.json();
        
        const lista = document.getElementById('lista');
        lista.innerHTML = ''; // Limpa a lista antes de renderizar

        // Se o banco estiver vazio
        if (jovens.length === 0) {
            lista.innerHTML = '<li style="text-align: center; color: var(--cor-texto-secundario);">Nenhum jovem cadastrado ainda.</li>';
            return;
        }

        // Para cada jovem, cria um card estilizado
        jovens.forEach(jovem => {
            const li = document.createElement('li');
            li.className = 'jovem-card'; // Aplica a classe CSS do card
            
            li.innerHTML = `
                <div class="jovem-info">
                    <span class="jovem-nome">${jovem.nome}</span>
                    <div class="jovem-detalhes">
                        <span><i class="fa-solid fa-envelope"></i> ${jovem.email}</span>
                        <span><i class="fa-solid fa-phone"></i> ${jovem.telefone}</span>
                    </div>
                </div>
                <div class="jovem-acoes">
                    <button class="btn-acao btn-editar" title="Editar" 
                            onclick="editarJovem(${jovem.id}, '${jovem.nome}', '${jovem.email}', '${jovem.telefone}')">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button class="btn-acao btn-deletar" title="Excluir" 
                            onclick="deletarJovem(${jovem.id})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;
            lista.appendChild(li);
        });
    } catch (error) {
        console.error('Erro ao carregar lista:', error);
    }
}

// 2. Função para Excluir
async function deletarJovem(id) {
    // Pergunta de confirmação nativa do navegador
    const confirmacao = confirm('Tem certeza que deseja excluir este jovem?');
    
    if (confirmacao) {
        await fetch(`${apiURL}/${id}`, {
            method: 'DELETE'
        });
        
        alert('Jovem excluído com sucesso!');
        carregarJovens(); // Atualiza a lista na tela sem precisar recarregar a página
    }
}

// 3. Função para Editar (usando Prompts para simplificar a interface)
async function editarJovem(id, nomeAtual, emailAtual, numeroAtual) {
    // Pede os novos dados (se o usuário cancelar ou deixar em branco, mantém o atual)
    const novoNome = prompt('Editar Nome:', nomeAtual) || nomeAtual;
    const novoEmail = prompt('Editar Email:', emailAtual) || emailAtual;
    const novoNumero = prompt('Editar Número:', numeroAtual) || numeroAtual;

    // Se houve alguma alteração real, envia para o Back-end
    if (novoNome !== nomeAtual || novoEmail !== emailAtual || novoNumero !== numeroAtual) {
        
        const dadosAtualizados = {
            nome: novoNome,
            email: novoEmail,
            numero: novoNumero
        };

        await fetch(`${apiURL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dadosAtualizados)
        });

        alert('Dados atualizados com sucesso!');
        carregarJovens(); // Recarrega os cards
    }
}

// Executa a função de carregar a lista assim que a página abre
document.addEventListener('DOMContentLoaded', () => {
    carregarJovens();
});
</script>
