<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar jovens - Sistema RUAH</title>
    
    <link rel="stylesheet" href="estilos/edicao.css">
</head>
<body>
    <div id="menu">
        <div id="perfil">
             <svg class="user-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 6C13.93 6 15.5 7.57 15.5 9.5C15.5 11.43 13.93 13 12 13C10.07 13 8.5 11.43 8.5 9.5C8.5 7.57 10.07 6 12 6ZM12 20C9.97 20 7.57 19.18 5.86 17.12C7.55 15.8 9.68 15 12 15C14.32 15 16.45 15.8 18.14 17.12C16.43 19.18 14.03 20 12 20Z" />
                </svg>
                <span>Usuario</span>
        </div>
        <div id="botoes">
           <a href="home.html">home</a>
            <a href="listagem.html">Lista dos jovens</a>
            <a href="cadastro.html">Cadastrar</a>
           
        </div>
        <div class="dropdown">
                <span class="text-button dropbtn">MENU ▼</span>
                <div class="dropdown-content">
                    <a href="home.html">home</a>
            <a href="listagem.html">Lista dos jovens</a>
            <a href="cadastro.html">Cadastrar</a>
            <a href="CadastroEdicaojovens.html">Editar jovens</a>
            <a href="RelatorioPresenca.html">Relatorio de presença</a> 
            <a href="TabelaPresenca.html">Tabela de presença</a>
             <a href="Configuracoes.html">Configurações</a>
                </div>
            </div>
        <div id="sair">
            <button id="btnSair">deslogar</button>
        </div>
    </div>
    <main class="main-content">
    
        <div class="card card-left">
            <h2>Buscar jovem</h2>
            <div class="form-group">
                <label>Email</label>
           
                <input type="email" id="inputBuscaEmail" placeholder="Digite o email para buscar">
            </div>
          
            <button class="primary-button" id="btnBuscar">Buscar</button>
        </div>

        <div class="card card-right">
            <h2>Editar Jovem</h2>
            <div class="form-group">
                <label>Nome</label>
               
                <input type="text" id="inputEditNome" disabled placeholder="Busque um jovem primeiro">
            </div>
            <div class="form-group">
                <label>Email</label>
         
                <input type="email" id="inputEditEmail" disabled placeholder="Busque um jovem primeiro">
            </div>
            <div class="form-group">
                <label>Telefone</label>
              
                <input type="text" id="inputEditTelefone" disabled placeholder="Busque um jovem primeiro">
            </div>
           
            <button class="primary-button" id="btnSalvarEdicao" disabled>Salvar Alterações</button>
        </div>
    </main>
    <script>
// Variável global para guardar o ID do jovem que estamos editando no momento
    let idJovemEditando = null;

    window.addEventListener('DOMContentLoaded', () => {
        const usuarioSalvo = localStorage.getItem('usuarioLogado');
        if (usuarioSalvo) {
            const usuario = JSON.parse(usuarioSalvo);
            document.querySelector('.user-profile span').textContent = usuario.nome;
        } else {
            window.location.href = 'login.html';
        }
    });

    // ==========================================
    // LÓGICA DE BUSCAR JOVEM
    // ==========================================
    document.getElementById('btnBuscar').addEventListener('click', async () => {
        const emailBusca = document.getElementById('inputBuscaEmail').value.trim();
        
        if (!emailBusca) {
            alert('Por favor, digite um email para buscar.');
            return;
        }

        try {
            // Chama a nova rota de busca passando o email
            const resposta = await fetch(`/api/busca-jovem?email=${encodeURIComponent(emailBusca)}`);
            const dados = await resposta.json();

            if (resposta.ok) {
                // Guarda o ID para usarmos na hora de salvar
                idJovemEditando = dados.id;

                // Preenche os campos da direita
                document.getElementById('inputEditNome').value = dados.nome;
                document.getElementById('inputEditEmail').value = dados.email;
                document.getElementById('inputEditTelefone').value = dados.telefone || '';

                // Desbloqueia os campos para edição
                document.getElementById('inputEditNome').disabled = false;
                document.getElementById('inputEditEmail').disabled = false;
                document.getElementById('inputEditTelefone').disabled = false;
                document.getElementById('btnSalvarEdicao').disabled = false;

            } else {
                alert(dados.erro || 'Erro ao buscar.');
                limparEBloquearCampos();
            }
        } catch (erro) {
            console.error('Erro:', erro);
            alert('Erro de conexão com o servidor.');
        }
    });

    // ==========================================
    // LÓGICA DE SALVAR ALTERAÇÕES (EDITAR)
    // ==========================================
    document.getElementById('btnSalvarEdicao').addEventListener('click', async () => {
        if (!idJovemEditando) return;

        const nome = document.getElementById('inputEditNome').value.trim();
        const email = document.getElementById('inputEditEmail').value.trim();
        const numero = document.getElementById('inputEditTelefone').value.trim(); // Enviamos como 'numero'

        if (!nome || !email || !numero) {
            alert('Por favor, preencha todos os campos!');
            return;
        }

        try {
            // Manda os dados atualizados para a rota PUT usando o ID do jovem
            const resposta = await fetch(`/api/jovens/${idJovemEditando}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, numero })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                alert('Dados do jovem atualizados com sucesso!');
                limparEBloquearCampos();
                document.getElementById('inputBuscaEmail').value = ''; // Limpa a barra de busca também
            } else {
                alert(dados.erro || 'Erro ao atualizar.');
            }
        } catch (erro) {
            console.error('Erro:', erro);
            alert('Erro de conexão com o servidor.');
        }
    });

    // Função auxiliar para deixar os campos travados novamente após editar ou se falhar a busca
    function limparEBloquearCampos() {
        idJovemEditando = null;
        const campos = ['inputEditNome', 'inputEditEmail', 'inputEditTelefone'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            el.value = '';
            el.disabled = true;
        });
        document.getElementById('btnSalvarEdicao').disabled = true;
    }

    // Lógica do botão de deslogar
    document.getElementById('btnSair').addEventListener('click', function() {
        localStorage.clear(); 
        sessionStorage.clear(); 
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
