<script>
    window.addEventListener('DOMContentLoaded', async () => {
        const usuarioSalvo = localStorage.getItem('usuarioLogado');

        if (usuarioSalvo) {
            const usuario = JSON.parse(usuarioSalvo);
            document.querySelector('#perfil span').textContent = usuario.nome;
            
            // Carrega os dados dinamicamente ao abrir
            await carregarDadosSetores();
        } else {
            window.location.href = 'login.html';
        }
    });

    async function carregarDadosSetores() {
        const corpoTabela = document.querySelector('.data-table tbody');
        
        try {
            // Rota correta conforme seu server.js
            const resposta = await fetch('/api/config/setores');
            const setores = await resposta.json();

            if (!resposta.ok) throw new Error('Erro ao carregar');

            corpoTabela.innerHTML = ''; 

            if (setores.length === 0) {
                corpoTabela.innerHTML = '<tr><td colspan="3">Nenhum setor encontrado.</td></tr>';
                return;
            }

            setores.forEach(setor => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${setor.nome}</td>
                    <td>${setor.idade_min}</td>
                    <td>${setor.idade_max}</td>
                `;
                corpoTabela.appendChild(tr);
            });

        } catch (erro) {
            console.error('Erro:', erro);
            corpoTabela.innerHTML = '<tr><td colspan="3">Erro ao carregar dados.</td></tr>';
        }
    }
    async function carregarSetoresParaSelect() {
    const selectSetor = document.getElementById('selectSetor');
    
    try {
        // Busca os dados da API que você já configurou no server.js
        const resposta = await fetch('/api/config/setores');
        const setores = await resposta.json();

        if (!resposta.ok) throw new Error('Erro ao carregar');

        // Limpa o select (mantém apenas a primeira opção vazia)
        selectSetor.innerHTML = '<option value="">Selecione um setor...</option>';

        setores.forEach(setor => {
            const option = document.createElement('option');
            option.value = setor.id; // O valor que vai para o banco
            option.textContent = setor.nome; // O que o usuário vê
            selectSetor.appendChild(option);
        });

    } catch (erro) {
        console.error('Erro ao carregar setores para o select:', erro);
    }
}

// Chame esta função junto com a carregarDadosSetores no seu DOMContentLoaded:
window.addEventListener('DOMContentLoaded', async () => {
    // ... seu código de verificação de login ...
    await carregarDadosSetores();
    await carregarSetoresParaSelect(); // Adicione esta linha
});

    document.getElementById('btnSair').addEventListener('click', function() {
        localStorage.clear(); 
        window.location.href = 'login.html';
    });
</script>
